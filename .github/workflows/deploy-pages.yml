name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Generate site
        run: python generate.py
      
      # --- NEW DEBUGGING STEP ---
      - name: Debug - Check what was generated
        run: |
          echo "=== 1. Root Directory Contents ==="
          ls -la
          echo "=== 2. Is the static folder here? ==="
          ls -la static/ || echo "NO STATIC FOLDER FOUND"
          echo "=== 3. Is the output folder here? ==="
          ls -la output/ || echo "NO OUTPUT FOLDER FOUND"
          echo "=== 4. What is inside output/static/images? ==="
          ls -la output/static/images/ || echo "NO IMAGES FOUND IN OUTPUT"
      # --------------------------
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './output'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
